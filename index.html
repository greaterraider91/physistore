<!DOCTYPE html>
<html>
<head>
<title>PHYSISTORE</title>
</head>
<body>

<script>
  const xhttp = new XMLHttpRequest();
        xhttp.onreadystatechange = function ()
         {
            if (this
            .readyState == 4 
            && 
            this.status == 200) {
                let xmlDoc = this.responseXML;
                let labels = xmlDoc
                .getElementsByTagName("label");
                let short-desc = xmlDoc
                .getElementsByTagName("short-desc");
                for (var i = 0; i < labels.length; i++) {
                    console.log(`${labels[i]
                        .childNodes[0]
                        .nodeValue} ${short-desc[i]
                            .childNodes[0]
                            .nodeValue} `);
                }
            }
        };
        xhttp.open("GET", "PHYSISTORE-featured.xml", true);
        xhttp.send();
</script>

</body>
</html>
